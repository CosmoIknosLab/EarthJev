[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earthjev"
version = "0.1.0"
description = "EarthJev: calibrated, non-generative answers to typed questions about 12-band Sentinel-2 images"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Domenico Benfenati"},
    {name = "Antonio Maria Rinaldi"},
    {name = "Cristian Tommasino"},
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
