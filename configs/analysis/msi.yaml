# Statistics spec for scripts/analysis/paired_bootstrap.py: test sets, models (one prediction file per seed and
# test set) and the hypotheses of the paper, fixed before the models were trained. The task-specific models were
# trained with the same questions and splits (scripts/analysis/submit_msi.sh taskspecific).
reference: earthjev
test_sets:
  corine: data/earthjev/reben5pct_msi/test.jsonl
  unseen: data/earthjev/reben5pct_msi/test_unseen.jsonl
  rsvqaxben: data/earthjev/rsvqaxben_test/presence.jsonl
  bentxt: data/earthjev/bentxt/bench.jsonl
models:
  earthjev:
    name: EarthJev-MSI
    corine:
    - runs/eval/msi_earthjev_s0_test/probe.logits.jsonl
    - runs/eval/msi_earthjev_s1_test/probe.logits.jsonl
    - runs/eval/msi_earthjev_s2_test/probe.logits.jsonl
    unseen:
    - runs/eval/msi_earthjev_s0_unseen/probe.logits.jsonl
    - runs/eval/msi_earthjev_s1_unseen/probe.logits.jsonl
    - runs/eval/msi_earthjev_s2_unseen/probe.logits.jsonl
    rsvqaxben:
    - runs/eval/msi_earthjev_s0_rsvqa/probe.logits.jsonl
    - runs/eval/msi_earthjev_s1_rsvqa/probe.logits.jsonl
    - runs/eval/msi_earthjev_s2_rsvqa/probe.logits.jsonl
    bentxt:
    - runs/eval/msi_earthjev_s0_bentxt/probe.logits.jsonl
    - runs/eval/msi_earthjev_s1_bentxt/probe.logits.jsonl
    - runs/eval/msi_earthjev_s2_bentxt/probe.logits.jsonl
  earthjev_drop:
    name: EarthJev-MSI, extra bands zeroed at test
    corine:
    - runs/eval/msi_earthjev_s0_test_drop/probe.logits.jsonl
    - runs/eval/msi_earthjev_s1_test_drop/probe.logits.jsonl
    - runs/eval/msi_earthjev_s2_test_drop/probe.logits.jsonl
    unseen:
    - runs/eval/msi_earthjev_s0_unseen_drop/probe.logits.jsonl
    - runs/eval/msi_earthjev_s1_unseen_drop/probe.logits.jsonl
    - runs/eval/msi_earthjev_s2_unseen_drop/probe.logits.jsonl
    rsvqaxben:
    - runs/eval/msi_earthjev_s0_rsvqa_drop/probe.logits.jsonl
    - runs/eval/msi_earthjev_s1_rsvqa_drop/probe.logits.jsonl
    - runs/eval/msi_earthjev_s2_rsvqa_drop/probe.logits.jsonl
    bentxt:
    - runs/eval/msi_earthjev_s0_bentxt_drop/probe.logits.jsonl
    - runs/eval/msi_earthjev_s1_bentxt_drop/probe.logits.jsonl
    - runs/eval/msi_earthjev_s2_bentxt_drop/probe.logits.jsonl
  gensft:
    name: Qwen3.5-0.8B generative (12 bands)
    corine:
    - runs/eval/msi_gensft_s0_test
    - runs/eval/msi_gensft_s1_test
    - runs/eval/msi_gensft_s2_test
    unseen:
    - runs/eval/msi_gensft_s0_unseen
    - runs/eval/msi_gensft_s1_unseen
    - runs/eval/msi_gensft_s2_unseen
    rsvqaxben:
