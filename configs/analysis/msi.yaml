    - runs/eval/msi_gensft_s1_rsvqa
    - runs/eval/msi_gensft_s2_rsvqa
    bentxt:
    - runs/eval/msi_gensft_s0_bentxt
    - runs/eval/msi_gensft_s1_bentxt
    - runs/eval/msi_gensft_s2_bentxt
  gensft_sum:
    name: Qwen3.5-0.8B generative (12 bands), option scoring (summed)
    field: logits
    corine:
    - runs/eval/msi_gensft_s0_test/option_scores.jsonl
