    name: U-Net + rules (reference)
    corine:
    - runs/eval/r2_rules_test
hypotheses:
  H1:
    type: equivalence
    margin: 1.0
    test_set: corine
    compare:
    - qwen3vl
    - internvl3
    - earthdial
    - gensft
  H2:
    type: superiority
    test_set: corine
    compare:
    - resnet50
    - swin_t
    - mambavision_t
  H3:
    type: superiority
    test_set: corine
    compare:
    - earthjev_drop
